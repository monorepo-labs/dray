name: CLI build
description: >
  Rust for one target, the cargo cache, and the release build of `dray` and
  `dray-serve`. One place, so release-cli.yml and warm-cli-cache.yml compile
  with the same steps, flags and env and meet on the same cache key.

inputs:
  target:
    description: The target triple to build.
    required: true
  runner:
    description: >
      The runner label the build runs on. Part of the key, so a lookup made on
      another runner finds the build's own entry, and a release moved to
      another image misses rather than restoring artifacts built elsewhere.
    required: true
  lookup-only:
    description: Compute the key and check it exists; restore and build nothing.
    default: "false"

outputs:
  cache-key:
    description: The exact key this run looked for, for warm-cli-cache to save under.
    value: ${{ steps.cache.outputs.cache-primary-key }}
  cache-hit:
    description: Whether that exact key already exists.
    value: ${{ steps.cache.outputs.cache-hit }}
  cache-path:
    description: Every path the key covers.
    value: ${{ steps.key.outputs.paths }}
  serve-bin:
    description: The unstripped `dray-serve`, relative to the workspace.
    value: apps/desktop/src-tauri/target/${{ inputs.target }}/serve/dray-serve

runs:
  using: composite
  steps:
    - id: rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        targets: ${{ inputs.target }}

    # Plain `actions/cache` and `registry/src` kept, for desktop-setup's
    # reason: rust-cache drops `src`, re-extraction stamps it newer than the
    # restored `target`, and every crate with a build script rebuilds.
    #
    # The lockfiles are hashed without the root package's `version` line. Every
    # release bump moves that line and nothing else in them, and the `dray`
    # crates rebuild on a tag whatever the cache holds, so leaving it in would
    # retire a still-exact cache once per release and re-warm two Macs for it.
    # The action itself is hashed too: a changed flag here is a new key.
    - id: key
      shell: bash
      run: |
        strip_root() { awk 'skip { skip = 0; next } /^name = "dray"$/ { skip = 1 } { print }' "$1"; }
        # Windows' Git Bash has no `shasum`; both print the same digest.
        sha256() { if command -v sha256sum >/dev/null 2>&1; then sha256sum; else shasum -a 256; fi; }
        hash=$( {
          strip_root apps/cli/Cargo.lock
          strip_root apps/desktop/src-tauri/Cargo.lock
          cat "$GITHUB_ACTION_PATH/action.yml"
        } | sha256 | cut -c1-16)
        prefix="cli-cargo-${{ inputs.target }}-${{ inputs.runner }}-${{ steps.rust.outputs.cachekey }}-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=$prefix$hash" >> "$GITHUB_OUTPUT"
        {
          echo 'paths<<EOF'
          printf '%s\n' '~/.cargo/registry/index' '~/.cargo/registry/cache' \
            '~/.cargo/registry/src' 'apps/cli/target' 'apps/desktop/src-tauri/target'
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    # Restore only. Saving is warm-cli-cache.yml's, on `main`, the one scope a
    # tag build can read; a tag saving writes under its own ref, which no later
    # tag reads. The prefix carries a dependency change across until the warm
    # run saves the new key.
    # Skipped on the release Mac. Its runners set CARGO_BUILD_BUILD_DIR to a
    # folder outside the checkout, so checkout's `git clean` never reaches the
    # intermediates and they persist between runs; a restore would only lay
    # older artifacts over them.
    - id: cache
      if: runner.environment == 'github-hosted'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.key.outputs.paths }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}
        lookup-only: ${{ inputs.lookup-only }}
        # Or the Windows entry, saved on Windows, is invisible to warm-cli-cache's
        # lookup on Linux and rebuilt on every push. A no-op off Windows.
        enableCrossOsArchive: true

    - name: Build dray
      if: inputs.lookup-only != 'true'
      shell: bash
      working-directory: apps/cli
      run: cargo build --release --target ${{ inputs.target }}

    # From the same commit as the CLI, so one tag is one version of both. The
    # CLI's version rides into the server, which reports it to the app so the
    # app can tell whether a newer release is out on its channel. It reaches
    # the `dray` crate alone (`option_env!`), so it costs no dependency a
    # rebuild. `serve` is the server's own profile (Cargo.toml), so the app's
    # `tauri build` keeps the plain release one.
    - name: Build dray-serve
      if: inputs.lookup-only != 'true'
      shell: bash
      working-directory: apps/desktop/src-tauri
      run: |
        export DRAY_CLI_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' "$GITHUB_WORKSPACE/apps/cli/Cargo.toml" | head -n 1)
        cargo build --profile serve --no-default-features --features serve \
          --bin dray-serve --target ${{ inputs.target }}
