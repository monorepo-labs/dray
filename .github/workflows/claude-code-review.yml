name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      # Not a `paths-ignore` filter: that leaves no run at all, so the required
      # `claude-review` check sat pending on every docs-only PR. Skipping here
      # lets the check pass. Code under apps/docs and apps/web is still reviewed.
      - name: Check for files worth reviewing
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/$PR/files" --jq '.[].filename')
          code=$(printf '%s\n' "$files" | grep -viE '\.(md|mdx|png|jpe?g|gif|svg|webp|ico|mp4|mov)$' | grep -v '^$' || true)
          if [ -n "$code" ]; then
            echo "review=true" >> "$GITHUB_OUTPUT"
          else
            echo "review=false" >> "$GITHUB_OUTPUT"
            echo "Only markdown, images or video changed; no review needed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout repository
        if: steps.scope.outputs.review == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        if: steps.scope.outputs.review == 'true'
        id: claude-review
        uses: anthropics/claude-code-action@v1
        # The action stops at Claude's first final reply, and a background
        # subagent let that reply be "still waiting" with nothing posted.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Repo-local copy of the code-review plugin's command that re-reviews
          # each push instead of skipping a PR it has commented on once.
          prompt: '/ci-code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The command's own allowed-tools last only for the turn it runs in,
          # so its subagents' gh calls were denied without these.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh api:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

