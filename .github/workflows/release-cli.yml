# Builds and publishes the `dray` CLI.
#
# Separate from the app's release for a reason, not just tidiness: the two ship
# on their own schedules and the CLI has to run on linux, where there is no Dray
# app at all. `cli-v*` tags keep them from colliding — the app's pipeline reads
# `v*` and writes the updater manifests on the `updates` branch, none of which
# this touches.
#
# Third-party actions are pinned to commit SHAs, not tags. A tag is mutable and
# a branch more so — `dtolnay/rust-toolchain@stable` moves by design — so a tag
# reference hands whatever it points at *today* the token this job holds. The
# trailing comment is the human-readable version; bump both together.
name: release-cli

on:
  push:
    tags:
      - "cli-v*"
  # So the matrix can be proved without minting a tag; publishes nothing.
  workflow_dispatch:

# Read by default. Only the publish job below widens it, so a compromised
# action in the build matrix — which is where every third-party dependency runs
# — cannot write releases or move refs.
permissions:
  contents: read

jobs:
  # Native, and separate from the matrix on purpose. `macos-latest` is arm64,
  # so `cargo test --target x86_64-apple-darwin` there has to *execute* an x86
  # binary — which needs Rosetta, and the arm runners do not ship it. Testing
  # per-target would fail that leg every release while passing on any developer
  # machine that happens to have Rosetta installed.
  #
  # Nothing here is platform-specific: the tests cover argument parsing, the
  # wire types and the embedded skill. The sockets are exercised against a
  # running app, not in unit tests.
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/cli

      # The shared crate too — it is a separate cargo project, so the CLI's own
      # test run does not cover it.
      - name: Test the protocol crate
        working-directory: crates/dray-proto
        run: cargo test

      - name: Test the CLI
        working-directory: apps/cli
        run: cargo test

      # `dray update` stops early when the resolved tag equals `cli-v` plus its
      # own `CARGO_PKG_VERSION`, so the two being equal is a contract now rather
      # than a convention. A tag pushed ahead of the crate version would ship a
      # binary that reads as out of date forever and reinstalls on every run.
      # Only a tag push can be checked; a dispatch run has no version to compare.
      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/cli-v')
        working-directory: apps/cli
        run: |
          set -euo pipefail
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag="${GITHUB_REF_NAME#cli-v}"
          echo "tag $tag, crate $crate"
          [ "$tag" = "$crate" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match apps/cli version $crate"
            exit 1
          }

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      # Keyed on the CLI's own lockfile: it and the app are separate cargo
      # projects, so a change to the app's dependencies must not evict this.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/cli
          key: ${{ matrix.target }}

      - name: Build
        working-directory: apps/cli
        run: cargo build --release --target ${{ matrix.target }}

      # Named after the target triple because that is what install.sh derives
      # from `uname`. Rename either and the installer 404s.
      #
      # The checksum ships beside the archive so the installer can verify what
      # it is about to execute. `shasum` on macOS, `sha256sum` on linux — the
      # runners differ, and the output format is the same either way.
      - name: Package
        working-directory: apps/cli
        run: |
          set -euo pipefail
          archive="dray-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" dray
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dray-${{ matrix.target }}
          path: |
            apps/cli/dray-${{ matrix.target }}.tar.gz
            apps/cli/dray-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    # A dispatch run proves the matrix and stops here; only a tag publishes.
    if: startsWith(github.ref, 'refs/tags/cli-v')
    runs-on: ubuntu-latest

    # The one job that needs it, and it runs no third-party code but the
    # release action itself.
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      # Proves the archives survived the trip intact before any of them is
      # published under a version number people will trust.
      - name: Verify checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          ls -1
          sha256sum -c ./*.sha256

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
          # install.sh resolves the newest `cli-v*` tag without reading this
          # flag, so hard-coding it false is what keeps the resolver honest — a
          # CLI marked prerelease would be handed to everyone re-running the
          # installer. Teaching the resolver to read the flag is the moment a
          # beta channel becomes possible, and not before.
          prerelease: false
          generate_release_notes: true
