name: Release

# A tag is the whole trigger, and its shape picks the channel: `v0.3.0` is
# stable, `v0.3.0-beta.1` is beta. Semver's own prerelease rule is what makes
# that work end to end — the updater compares versions, and `0.3.0-beta.1` is
# older than `0.3.0`, so a beta user lands on the stable release when it ships.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # Part of the cache key's environment, so it has to match warm-cache.yml.
  CARGO_INCREMENTAL: 0

jobs:
  build:
    runs-on: macos-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      # The manifest's version is the app's, not the tag's — a tag that names a
      # version the conf doesn't carry publishes a manifest no client considers
      # newer, and the release silently reaches nobody. Fail loudly instead.
      - run: |
          V="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match tauri.conf.json version v$V" >&2
            exit 1
          fi

      - id: channel
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # The release notes are read from CHANGELOG.md rather than written a
      # second time here. GitHub appends its generated commit list underneath,
      # so the hand-written part stays a summary and the file stays the source.
      - id: notes
        run: |
          V="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          BODY="$(awk -v want="## $V" '
            $0 == want { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' apps/desktop/CHANGELOG.md)"

          # A stable release with no section would publish notes saying nothing,
          # which is worth stopping for — same reason the version guard above
          # is fatal. A prerelease is allowed to ship without one.
          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            if [ "${{ steps.channel.outputs.channel }}" = "stable" ]; then
              echo "apps/desktop/CHANGELOG.md has no '## $V' section" >&2
              exit 1
            fi
            BODY=""
          fi

          {
            echo "body<<CHANGELOG_EOF"
            printf '%s\n' "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Restores only — `cache/restore`, not `cache`. The entry is written by
      # warm-cache.yml on `main`, the one scope a tag build can read from;
      # saving here would write one under this tag's own ref that nothing will
      # ever read again. Key and paths have to stay in step with that file,
      # `registry/src` above all — see the note there for what it costs to drop.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            apps/desktop/src-tauri/target
          key: darwin-cargo-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: darwin-cargo-${{ steps.rust.outputs.cachekey }}-

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundle. Separate from Apple's signature and not
          # optional: without it the client refuses the download.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple's, which is what stops macOS blocking the download outright.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Aptabase's write-only app key, read by `option_env!` at compile
          # time. Unset is not fatal — the build ships with analytics inert,
          # which is also what a local build does.
          APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
        with:
          # The Tauri project no longer sits at the repo root.
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          releaseBody: ${{ steps.notes.outputs.body }}
          generateReleaseNotes: true
          # One bundle for both architectures. The action expands the universal
          # entry into per-arch keys in `latest.json`, so a client asking for
          # `darwin-aarch64` finds it.
          args: --target universal-apple-darwin

      # The bundler *warns* and carries on when notarization credentials are
      # missing or rejected — only an absent team id is fatal. So a release
      # that quietly shipped unnotarized looks exactly like one that worked,
      # until a user's Mac refuses to open it. `stapler validate` is what tells
      # the two apart: it fails unless a ticket is actually attached.
      - name: Verify the bundle is notarized
        run: |
          APP="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/$(jq -r .productName apps/desktop/src-tauri/tauri.conf.json).app"
          xcrun stapler validate "$APP"
          spctl --assess --verbose=2 --type exec "$APP"

  # The manifests live on a branch rather than in the release, because
  # `/releases/latest/` skips prereleases — so beta would have no fixed URL.
  # GitHub Pages serves this branch; the artifact URLs inside still point at
  # the release, which stays the CDN.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: updates
          fetch-depth: 1

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern latest.json --output manifest.json --clobber

          # Whether $1 is strictly newer than $2 — the same semver comparison
          # the updater plugin makes, prerelease rules included. Not `sort -V`,
          # which gets wrong exactly the case that matters here: it puts
          # 0.9.4-beta.2 *above* 0.9.4.
          newer() {
            node -e '
              const parse = (v) => {
                const [core, pre] = v.replace(/^v/, "").split("+")[0].split(/-(.+)/);
                return { core: core.split("."), pre: pre ? pre.split(".") : null };
              };
              // Digit strings compared by length then lexically, never through
              // Number(): above 2^53 distinct identifiers compare equal there,
              // and "equal" is a promote that can move a manifest backwards.
              const cmpNum = (a, b) => {
                a = a.replace(/^0+(?=\d)/, ""); b = b.replace(/^0+(?=\d)/, "");
                return a.length !== b.length ? a.length - b.length : a < b ? -1 : a > b ? 1 : 0;
              };
              const cmpId = (a, b) => {
                const na = /^\d+$/.test(a), nb = /^\d+$/.test(b);
                if (na && nb) return cmpNum(a, b);
                if (na !== nb) return na ? -1 : 1;
                return a < b ? -1 : a > b ? 1 : 0;
              };
              const cmp = (x, y) => {
                for (let i = 0; i < 3; i++) {
                  const c = cmpNum(x.core[i] ?? "0", y.core[i] ?? "0");
                  if (c) return c;
                }
                if (!x.pre || !y.pre) return (x.pre ? -1 : 0) - (y.pre ? -1 : 0);
                for (let i = 0; i < Math.max(x.pre.length, y.pre.length); i++) {
                  if (x.pre[i] === undefined) return -1;
                  if (y.pre[i] === undefined) return 1;
                  const c = cmpId(x.pre[i], y.pre[i]);
                  if (c) return c;
                }
                return 0;
              };
              process.exit(cmp(parse(process.argv[1]), parse(process.argv[2])) > 0 ? 0 : 1);
            ' "$1" "$2"
          }

          # Writes the release over a channel manifest unless that would move
          # the channel *backwards*. A stable release still serves both
          # channels — someone on beta should be offered the newer stable — but
          # a beta line runs ahead of stable for its whole life, so a stable
          # hotfix shipped while one is open must not clobber it: existing beta
          # users would see nothing (the client never downgrades), and a fresh
          # beta opt-in could never reach the beta at all. An equal version
          # rewrites, so re-running a release republishes its own manifest; a
          # missing or unreadable manifest is written, never an error.
          NEW="$(jq -r .version manifest.json)"
          promote() {
            cur="$(jq -r '.version // empty' "$1" 2>/dev/null || true)"
            if [ -n "$cur" ] && newer "$cur" "$NEW"; then
              echo "keeping $1 at $cur — $NEW is older"
            else
              cp manifest.json "$1"
            fi
          }

          promote beta.json
          if [ "${{ needs.build.outputs.channel }}" = "stable" ]; then
            promote stable.json
          fi
          rm manifest.json

          # Pages would otherwise run these through Jekyll.
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # A release that moved no manifest — a re-tag older than every
          # channel — leaves nothing staged, and an empty commit would fail
          # the job over a push that had nothing to say.
          git diff --cached --quiet || {
            git commit -m "release ${GITHUB_REF_NAME}"
            git push
          }
