name: Warm cache

# Exists for the cache it leaves behind, nothing else.
#
# The release workflow only ever runs on a tag, and GitHub scopes cache *reads*
# to the ref that wrote them plus the default branch. So each release wrote a
# 668 MiB cache under its own `refs/tags/…` scope that no later release could
# ever read — three identical keys, three separate scopes, `No cache found.`
# every time — and every build compiled the dependency tree from cold. That was
# ~19 of the ~20 minutes. `main` is the one scope a tag build can read.
#
# The cache key is written out by hand here and in the release job rather than
# derived, so the two halves meet on a string both files show. Anything feeding
# it — runner, toolchain, target list — has to match there too.

on:
  push:
    branches: [main]
    # The cache turns over on the Rust dependency graph, so frontend-only
    # commits have nothing to warm.
    paths:
      - "apps/desktop/src-tauri/**"
      - ".github/workflows/warm-cache.yml"
  workflow_dispatch:

concurrency:
  group: warm-cache
  cancel-in-progress: true

env:
  # Incremental artifacts are worthless across machines and are most of what a
  # target dir weighs. rust-cache used to set this; a plain cache does not.
  CARGO_INCREMENTAL: 0

jobs:
  warm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Runner, toolchain and target list all feed the cache key, so they have
      # to match the release job or the entry is unreadable there.
      - id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Plain `actions/cache` rather than `swatinem/rust-cache`, for one path in
      # this list: `registry/src`. rust-cache deletes it before saving, on the
      # reasoning that cargo can re-extract it from the `.crate` archives beside
      # it — true, and it halves the cache. But re-extraction stamps every
      # source file with the restore time, which lands them *newer* than the
      # `target` artifacts restored alongside. Registry deps are fingerprinted
      # by version rather than mtime, so most of the tree survives that; build
      # scripts are mtime-checked, so every crate carrying one reruns and
      # everything downstream of it rebuilds with it.
      #
      # Measured, with rust-cache reporting `full match: true`: 40 crates per
      # target — ring, libz-sys, libgit2-sys, lmdb-master-sys, the objc2 family,
      # tauri, and each of their dependents — for ~8 minutes a target. Tar
      # restores mtimes as they were saved, so keeping `src` keeps the order.
      #
      # The cost is a larger entry and a target dir nothing prunes. GitHub
      # evicts at 10 GB, least-recently-used, which is the only sweeper here.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            apps/desktop/src-tauri/target
          # The version bump in every release changes Cargo.lock, so the exact
          # key misses once per release by design. The prefix restore is what
          # carries the tree across; only `dray` itself moved.
          key: darwin-cargo-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: darwin-cargo-${{ steps.rust.outputs.cachekey }}-

      - run: pnpm install --frozen-lockfile

      # Compiled the way the release compiles it, rather than with a bare
      # `cargo build --release`. `tauri build` turns on production features —
      # `custom-protocol` among them — which change the feature set of `tauri`
      # and of everything depending on it, so artifacts built without them are
      # unusable to the release. Measured on v0.1.1: the cache restored a full
      # match and the release still rebuilt 79 crates, tauri, ring and
      # libgit2-sys included, for 15 of its 17 minutes.
      #
      # `--no-bundle` stops before bundling, so this needs no signing key and no
      # Apple credentials, and produces nothing but the cache. It runs
      # `beforeBuildCommand` itself, which is why there is no separate frontend
      # build step.
      - run: pnpm tauri build --no-bundle --target universal-apple-darwin
        working-directory: apps/desktop
