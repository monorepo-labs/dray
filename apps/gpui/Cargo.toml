[package]
name = "dray-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "dray-gpui"
path = "src/main.rs"

[dependencies]
# Zed's GPUI as a weekly crates.io snapshot of Zed main. The official `gpui`
# crate is a year old; this is what `gpui-component` pins too, so a kit stays
# reachable. Pinned exactly: GPUI breaks its API between snapshots.
gpui = { package = "gpui-pre", version = "=0.3.12" }
# `font-kit` is the macOS text system: without it GPUI falls back to a no-op one
# and draws no text at all, silently. `runtime_shaders` compiles Metal shaders at
# launch, so building needs the Command Line Tools rather than full Xcode.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "runtime_shaders"] }

# The core, for its types and its half of the serve wire. Default features off,
# so no Tauri; `serve` for `machines::admit_with` and the protocol constants.
dray_core = { package = "dray", path = "../desktop/src-tauri", default-features = false, features = ["serve"] }

anyhow = "1"
chrono = "0.4"
env_logger = "0.11"
futures = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "fs", "macros"] }
# Same major as the core's, so cargo builds it once.
tokio-tungstenite = { version = "0.30", default-features = false }
raw-window-handle = "0.6"
# Code colouring (src/code), in place of Shiki. One grammar crate per
# language; a language missing here draws as plain text, never fails.
tree-sitter-highlight = "0.27"
tree-sitter-language = "0.1.9"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-bash = "0.25.1"
tree-sitter-go = "0.25.0"
tree-sitter-css = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-yaml = "0.7.2"
tree-sitter-toml-ng = "0.7.0"
# Line and word diffs, in place of `@pierre/diffs`' jsdiff.
similar = "3.2.1"
# The text machinery under gpui-component: markdown parsing, layout and
# selection for the transcript. Its look is restyled, never kept (#856).
gpui_base = { package = "gpui-base", version = "=0.9.1" }

# Linux opens no window without a backend feature, and says nothing about it.
# X11 is what the boat sandboxes run, where the examples are screenshotted.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["x11"] }

# The window's glass: an NSVisualEffectView on the `sidebar` material, as
# tauri.conf.json asks for. Same majors as the core's and GPUI's.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSVisualEffectView", "NSView", "NSResponder", "NSWindow", "NSAppearance"] }
objc2-foundation = "0.3"

# With no windowing backend on, GPUI on Linux opens no window and says nothing.
# X11 is what the boat sandbox runs.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["x11"] }

# The spikes in examples/ that settled #856's open questions. Kept, so they
# can be run again against the next GPUI pin.
[dev-dependencies]
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.12" }
