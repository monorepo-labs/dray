[package]
name = "dray-island"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Dray Island on Linux: the panel that answers, replies and starts tasks without Dray's window."
publish = false

[[bin]]
name = "dray-island"
path = "src/main.rs"

# GPUI is taken from one Zed commit, bumped on purpose: the crates.io release
# is a 2025 snapshot that no longer builds. X11 alone, since the app forces X11
# too; native Wayland is #839.
[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "b1962f7cd8569ecade486c40320e3cff2d4b9d22", default-features = false, features = ["font-kit", "x11"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "b1962f7cd8569ecade486c40320e3cff2d4b9d22", default-features = false, features = ["x11", "font-kit"] }
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.30"
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
raw-window-handle = "0.6"
x11rb = { version = "0.13", features = ["xinput", "shape"] }

[profile.release]
strip = true
