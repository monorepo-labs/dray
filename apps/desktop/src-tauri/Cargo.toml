[package]
name = "dray"
version = "0.13.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

anyhow = "1.0.103"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.16", features = ["v7"] }
# Generates the TS mirror of the event model; `cargo test` writes ../src/types/.
ts-rs = { version = "12", features = ["serde-json-impl"] }
dirs = "6.0.0"
# `kill(pid, 0)`: whether the process named in a worktree lock is still alive,
# which is what separates a lock Dray may clear from one it must not.
libc = "0.2"
dray-proto = { path = "../../../crates/dray-proto" }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
fff-search = "0.10.3"
# Watches the docs panel's open files. Already in the tree behind `fff-search`,
# whose index keeps itself current the same way. Not to be confused with
# `notify-rust` below, which posts desktop banners.
notify = "9.0.0-rc.4"
# Attached images travel to the CLI as base64 content blocks.
base64 = "0.22"
# Desktop notifications are posted directly rather than through
# `tauri-plugin-notification`: only the handle `show` returns reports a click,
# and the plugin drops it. `preview-macos-un` is not optional — the default
# backend is `NSUserNotificationCenter`, which macOS no longer delivers for a
# GUI app at all. See notifications.rs.
notify-rust = { version = "4.18", features = ["preview-macos-un"] }

# Anonymous usage analytics. The client holds no persistent device id and the
# app key is compiled in from `APTABASE_KEY`; an absent key leaves the plugin
# registered and inert, which is what dev builds run with. See analytics.rs.
tauri-plugin-aptabase = "1.0.0"
# Linear's GraphQL API, and the only service this app talks to directly — `gh`
# and `claude` are reached by spawning them instead. `rustls` rather than the
# platform TLS so a Linux build needs no OpenSSL. See issues/linear.rs.
# `stream` is for the model download, which is hundreds of megabytes and must
# reach disk a chunk at a time — `bytes()` buffers the whole body first.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }

# Local speech-to-text. The engine is `transcribe-cpp` (MIT, "The transcribe.cpp
# authors") — its own repo, not the Handy app's; `cpal` captures the microphone
# and `rubato` resamples it to the 16kHz mono every model here expects. Audio
# never leaves the machine. See transcription/.
cpal = "0.16"
rubato = "0.16"
# macOS hands a *silent* stream to a process without microphone permission
# rather than refusing it, so nothing downstream can tell "denied" from "quiet
# room". This is what actually raises the system prompt. See transcription/.
tauri-plugin-macos-permissions = "2.3"
futures-util = "0.3"
# Verifies a downloaded model against the catalog's hash. A partial file left by
# a killed process is otherwise indistinguishable from a whole one.
sha2 = "0.10"

# Metal on macOS, CPU everywhere else — the backend is chosen at *build* time,
# so it cannot be switched per model or per machine. Split across two tables
# rather than one entry, since the `metal` feature does not compile elsewhere.
[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "0.2", default-features = false, features = [
  "metal",
] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
transcribe-cpp = { version = "0.2", default-features = false }

[dev-dependencies]
# Paused-clock tests for the engine's idle unload; a real ten-minute sleep is untestable.
tokio = { version = "1", features = ["test-util"] }
