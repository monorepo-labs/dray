[package]
name = "dray"
version = "0.9.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

anyhow = "1.0.103"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.16", features = ["v7"] }
# Generates the TS mirror of the event model; `cargo test` writes ../src/types/.
ts-rs = { version = "12", features = ["serde-json-impl"] }
dirs = "6.0.0"
# `kill(pid, 0)`: whether the process named in a worktree lock is still alive,
# which is what separates a lock Dray may clear from one it must not.
libc = "0.2"
dray-proto = { path = "../../../crates/dray-proto" }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
fff-search = "0.10.3"
# Attached images travel to the CLI as base64 content blocks.
base64 = "0.22"
# Desktop notifications are posted directly rather than through
# `tauri-plugin-notification`: only the handle `show` returns reports a click,
# and the plugin drops it. `preview-macos-un` is not optional — the default
# backend is `NSUserNotificationCenter`, which macOS no longer delivers for a
# GUI app at all. See notifications.rs.
notify-rust = { version = "4.18", features = ["preview-macos-un"] }

# Anonymous usage analytics. The client holds no persistent device id and the
# app key is compiled in from `APTABASE_KEY`; an absent key leaves the plugin
# registered and inert, which is what dev builds run with. See analytics.rs.
tauri-plugin-aptabase = "1.0.0"
# Linear's GraphQL API, and the only service this app talks to directly — `gh`
# and `claude` are reached by spawning them instead. `rustls` rather than the
# platform TLS so a Linux build needs no OpenSSL. See issues/linear.rs.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
