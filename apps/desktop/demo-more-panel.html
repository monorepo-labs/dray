<!doctype html>
<html lang="en" data-demo data-theme="default" data-mode="light" data-transparency>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dray — More panel demo</title>
    <script>
      // The same pre-paint read index.html makes, and the demo needs it for a
      // reason the app does not: the question this page exists to answer is
      // about a *colour*, so opening on a hardcoded mode shows the wrong one.
      try {
        var t = localStorage.getItem("ade.theme") || "default";
        var m = localStorage.getItem("ade.mode") || "light";
        var dark =
          m === "dark" ||
          (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        var el = document.documentElement;
        el.dataset.theme = t;
        el.dataset.mode = dark ? "dark" : "light";
        el.classList.toggle("dark", dark);
        el.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/demoMorePanel.tsx"></script>
  </body>
</html>
