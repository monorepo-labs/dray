<!doctype html>
<html lang="en" data-theme="default" data-mode="dark" data-transparency class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dray — composer demo</title>
    <script>
      // Same pre-paint theme setup as index.html, minus the vibrancy: a browser
      // has no window material behind it, so asking for one paints a hole.
      try {
        var t = localStorage.getItem("ade.theme") || "default";
        var m = localStorage.getItem("ade.mode") || "dark";
        var dark =
          m === "dark" ||
          (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        var el = document.documentElement;
        el.dataset.theme = t;
        el.dataset.mode = dark ? "dark" : "light";
        el.classList.toggle("dark", dark);
        el.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/demo/main.tsx"></script>
  </body>
</html>
