name: Dray
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 7WYP3LRDL8
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  Dray:
    type: application
    platform: iOS
    sources: [Dray]
    scheme:
      testTargets: [DrayTests, DrayUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yogesh.dray.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dray
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # Only HTTPS and standard crypto, so TestFlight asks nothing about export.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  DrayTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DrayTests]
    dependencies:
      - target: Dray
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yogesh.dray.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  DrayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DrayUITests]
    dependencies:
      - target: Dray
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yogesh.dray.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
