[package]
name = "dray"
version = "0.13.2"
edition = "2021"
license = "Apache-2.0"
description = "Run and manage Dray sessions from the command line."
repository = "https://github.com/monorepo-labs/dray"

[[bin]]
name = "dray"
path = "src/main.rs"

[dependencies]
dray-proto = { path = "../../crates/dray-proto" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde_json = "1"
qrcode = { version = "0.14.1", default-features = false }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
