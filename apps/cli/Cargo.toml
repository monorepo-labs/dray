[package]
name = "dray"
version = "0.18.2"
edition = "2021"
license = "Apache-2.0"
description = "Run and manage Dray sessions from the command line."
repository = "https://github.com/monorepo-labs/dray"

[[bin]]
name = "dray"
path = "src/main.rs"

[dependencies]
dray-proto = { path = "../../crates/dray-proto" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde_json = "1"
qrcode = { version = "0.14.1", default-features = false }

# Who serves the orchestration pipe (main.rs `served_by_this_user`). Already
# in the lock.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Pipes",
  "Win32_System_Threading",
]

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
